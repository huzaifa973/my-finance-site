baseURL = "https://dollarwise.xyz/"
title = "DollarWise — Money, Tech & Free Tools"
languageCode = "en-us"
defaultContentLanguage = "en"

# SEO: sitemap.xml is auto-generated; robots.txt is served from static/robots.txt
enableRobotsTXT = false

# Sitemap hints: Bing honors changefreq/priority; Google primarily uses lastmod.
# (Hugo's built-in sitemap template renders all three when set.)
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Full-site search index, generated at build time (used by /search/)
[outputFormats.search]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "search"]

# Clean permalinks for posts
[permalinks]
  posts = "/posts/:slug/"

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Markdown rendering niceties
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Build
[build]
  writeStats = false

# Site params
[params]
  adsense_publisher_id = "ca-pub-8574339224228858" # AdSense linked 2026-10-06; ad slots auto-render
  google_site_verification = "" # paste your Google Search Console verification code here
  pinterest_domain_verify = "" # paste ONLY the content value of Pinterest's p:domain_verify meta tag here (Settings → Claimed accounts → Claim)
  google_analytics_id = "G-N8W2MP31D6" # GA4 measurement ID — analytics active
  cloudflare_analytics_token = "" # or paste your Cloudflare Web Analytics beacon token here (alternative to GA4)
  # newsletter_provider = "" # e.g. "buttondown" or "convertkit" — see homepage newsletter section comments
