baseURL = "https://my-finance-site-byy.pages.dev/"
title = "DollarWise — Money, Tech & Free Tools"
languageCode = "en-us"
defaultContentLanguage = "en"

# SEO: let Hugo generate sitemap.xml (on by default) and robots.txt
enableRobotsTXT = true

# Clean permalinks for posts
[permalinks]
  posts = "/posts/:slug/"

# Taxonomies
[taxonomies]
  tag = "tags"

# Markdown rendering niceties
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Build
[build]
  writeStats = false

# Site params
[params]
  adsense_publisher_id = "" # paste your AdSense publisher ID (ca-pub-...) here to enable ad slots
  google_site_verification = "" # paste your Google Search Console verification code here
  # newsletter_provider = "" # e.g. "buttondown" or "convertkit" — see homepage newsletter section comments
