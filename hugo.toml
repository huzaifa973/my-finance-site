baseURL = "https://dollarwise.xyz/"
title = "DollarWise — Money, Tech & Free Tools"
languageCode = "en-us"
defaultContentLanguage = "en"

# SEO: sitemap.xml is auto-generated; robots.txt is served from static/robots.txt
enableRobotsTXT = false

# Clean permalinks for posts
[permalinks]
  posts = "/posts/:slug/"

# Taxonomies
[taxonomies]
  tag = "tags"

# Markdown rendering niceties
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Build
[build]
  writeStats = false

# Site params
[params]
  adsense_publisher_id = "ca-pub-8574339224228858" # AdSense linked 2026-10-06; ad slots auto-render
  google_site_verification = "" # paste your Google Search Console verification code here
  google_analytics_id = "G-N8W2MP31D6" # GA4 measurement ID — analytics active
  cloudflare_analytics_token = "" # or paste your Cloudflare Web Analytics beacon token here (alternative to GA4)
  # newsletter_provider = "" # e.g. "buttondown" or "convertkit" — see homepage newsletter section comments
