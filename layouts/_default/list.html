{{ define "main" }}
<main>
  <div class="wrap-wide">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{ "/" | relURL }}">Home</a> /
      <span aria-current="page">{{ .Title }}</span>
    </nav>
    <div class="section-head">
      <h2><span class="bar-gold"></span>{{ .Title }}</h2>
    </div>
    {{ with .Content }}
    <div class="archive-intro">
      {{ . }}
    </div>
    {{ end }}
    <div class="cards">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
