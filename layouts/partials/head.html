<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := .Title }}
{{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
{{ $desc := .Description | default (.Summary | plainify | truncate 160) | default .Site.Title }}
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="index, follow">
<meta name="author" content="DollarWise">

<!-- Open Graph -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">

<!-- Twitter cards -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $desc }}">

<!-- JSON-LD Article schema on posts -->
{{ if and .IsPage (eq .Section "posts") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ $desc | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ (.Lastmod.Format "2006-01-02") | jsonify }},
  "author": { "@type": "Organization", "name": "DollarWise" },
  "publisher": { "@type": "Organization", "name": "DollarWise" },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink | jsonify }} }
}
</script>
{{ end }}

<!-- FAQ schema when the page sets faq entries -->
{{ with .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{ range $i, $f := . }}{{ if $i }},{{ end }}
    { "@type": "Question", "name": {{ $f.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ $f.a | jsonify }} } }
    {{ end }}
  ]
}
</script>
{{ end }}

<style>
:root{
  --bg:#ffffff; --text:#1a1a1a; --muted:#5b6470; --accent:#0b6e4f;
  --accent-dark:#085c42; --card:#f6f8f7; --border:#e3e8e6; --maxw:760px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.7; font-size:17px;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 1.1rem}
header.site{border-bottom:1px solid var(--border); background:#fff}
header.site .wrap{display:flex; align-items:center; justify-content:space-between; padding-top:.9rem; padding-bottom:.9rem}
.logo{font-weight:800; font-size:1.25rem; color:var(--text)}
.logo span{color:var(--accent)}
nav.main a{margin-left:1rem; color:var(--text); font-size:.95rem}
nav.main a:hover{color:var(--accent)}
.hero{background:var(--card); border-bottom:1px solid var(--border); padding:3rem 0 2.5rem}
.hero h1{font-size:2rem; line-height:1.25; margin:0 0 .6rem}
.hero p{color:var(--muted); margin:0 0 1.2rem; font-size:1.08rem}
.btn{display:inline-block; background:var(--accent); color:#fff !important; padding:.65rem 1.3rem; border-radius:8px; font-weight:600}
.btn:hover{background:var(--accent-dark); text-decoration:none}
.post-list{list-style:none; margin:0; padding:0}
.post-list li{padding:1.4rem 0; border-bottom:1px solid var(--border)}
.post-list h2{font-size:1.3rem; margin:0 0 .3rem; line-height:1.4}
.post-list .meta,.meta{color:var(--muted); font-size:.85rem}
.post-list p{margin:.4rem 0 0; color:var(--muted)}
main{padding:2rem 0 3rem}
article h1{font-size:1.9rem; line-height:1.3; margin:0 0 .4rem}
article h2{font-size:1.45rem; margin:2.2rem 0 .6rem; line-height:1.35}
article h3{font-size:1.15rem; margin:1.6rem 0 .4rem}
article img{max-width:100%; height:auto; border-radius:8px}
article ul,article ol{padding-left:1.4rem}
article li{margin:.35rem 0}
.callout{background:var(--card); border-left:4px solid var(--accent); padding:1rem 1.2rem; border-radius:0 8px 8px 0; margin:1.5rem 0}
.faq h3{font-size:1.05rem}
.tags{margin-top:2rem}
.tags a{display:inline-block; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:.2rem .8rem; margin:0 .4rem .4rem 0; font-size:.85rem; color:var(--muted)}
footer.site{border-top:1px solid var(--border); background:var(--card); padding:2rem 0; margin-top:2rem; font-size:.88rem; color:var(--muted)}
footer.site .links a{margin-right:1rem}
.disclosure{font-size:.8rem; margin-top:1rem}
table{border-collapse:collapse; width:100%; margin:1.2rem 0; font-size:.95rem}
th,td{border:1px solid var(--border); padding:.55rem .7rem; text-align:left}
th{background:var(--card)}
.calc{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:1.4rem; margin:1.5rem 0}
.calc label{display:block; font-weight:600; margin:.8rem 0 .3rem}
.calc input{width:100%; padding:.6rem; font-size:1rem; border:1px solid var(--border); border-radius:6px}
.calc button{background:var(--accent); color:#fff; border:0; padding:.7rem 1.4rem; border-radius:8px; font-size:1rem; font-weight:600; margin-top:1rem; cursor:pointer}
.calc .result{margin-top:1.2rem}
.bar{height:14px; border-radius:7px; background:var(--border); margin:.3rem 0 .8rem; overflow:hidden}
.bar i{display:block; height:100%; border-radius:7px}
@media(max-width:560px){
  .hero h1{font-size:1.6rem}
  nav.main a{margin-left:.7rem}
}
</style>
