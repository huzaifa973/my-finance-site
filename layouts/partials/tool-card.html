{{/* Tool card — used by tool category pages and the tools hub. Context: a Page. */}}
<article class="card">
  <div class="card-body">
    <span class="card-tag">Free tool</span>
    <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="card-excerpt">{{ .Description | default (.Summary | plainify | truncate 140) }}</p>
    <a class="card-link" href="{{ .RelPermalink }}">Use free tool →</a>
  </div>
</article>
